<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0A4B8C" />
  <title>You're offline | Classes by Koustav</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      background: #F7F8FA;
      color: #1F2937;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    .card {
      width: 100%;
      max-width: 380px;
      background: #fff;
      border: 1px solid #E2E8F0;
      border-radius: 16px;
      padding: 32px 24px;
      text-align: center;
      box-shadow: 0 1px 3px rgba(10, 75, 140, 0.08);
    }
    img { width: 64px; height: 64px; border-radius: 16px; }
    h1 { margin: 16px 0 8px; font-size: 20px; color: #0A4B8C; }
    p { margin: 0 0 24px; font-size: 14px; line-height: 1.6; color: #4B5563; }
    button {
      width: 100%;
      padding: 12px 16px;
      border: 0;
      border-radius: 10px;
      background: #0A4B8C;
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { background: #083D72; }
  </style>
</head>
<body>
  <main class="card">
    <img src="/icons/icon-192.png" alt="" />
    <h1>You're offline</h1>
    <p>Classes by Koustav needs an internet connection. Check your Wi-Fi or mobile data, then try again. A running test timer keeps going while you're away.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </main>
  <script>
    window.addEventListener("online", function () { location.reload(); });
  </script>
</body>
</html>
