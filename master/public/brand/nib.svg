<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Proshnopotro">
  <defs>
    <linearGradient id="nib-left" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b4fb3"/>
      <stop offset="1" stop-color="#172a6b"/>
    </linearGradient>
    <linearGradient id="nib-right" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#0f8f86"/>
    </linearGradient>
  </defs>
  <!-- White outline behind the nib, so it reads on dark and light alike -->
  <path d="M32 5.2 L46.3 30.6 Q51.6 40.4 44.2 48.5 L41.4 59.4 H22.6 L19.8 48.5 Q12.4 40.4 17.7 30.6 Z" fill="#ffffff"/>
  <!-- Left half, navy -->
  <path d="M32 7.5 L32 58 H23.8 L21.2 48 Q14.2 40.3 19.3 31.2 Z" fill="url(#nib-left)"/>
  <!-- Right half, teal -->
  <path d="M32 7.5 L44.7 31.2 Q49.8 40.3 42.8 48 L40.2 58 H32 Z" fill="url(#nib-right)"/>
  <!-- Collar where the nib meets the pen -->
  <path d="M23.2 52.5 H40.8" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round" opacity="0.85"/>
  <!-- Slit from the tip to the breather hole -->
  <path d="M32 9 V33" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round"/>
  <!-- Breather hole -->
  <circle cx="32" cy="37" r="4.2" fill="#ffffff"/>
  <!-- Ball at the tip -->
  <circle cx="32" cy="6" r="2.6" fill="#172a6b" stroke="#ffffff" stroke-width="1.4"/>
</svg>
